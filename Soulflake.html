<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Soulflake</title>
  <meta name="theme-color" content="#070B14" />
  <meta name="description" content="A profile so precise it feels invasive — and clear enough to act on." />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --midnight: #070B14;
      --indigo: #1A1540;
      --ice-violet: #A78BFA;
      --signal-cyan: #67E8F9;
      --frost: #F8FAFC;
      --graphite: #94A3B8;
      --border: #2a3348;
      --surface: #12182a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--midnight); color: var(--frost); font-family: Inter, system-ui, sans-serif; min-height: 100%; }
    button { font-family: inherit; cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    .serif { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; }
    .glow { position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background: radial-gradient(ellipse 50% 36% at 70% 12%, rgba(167,139,250,.12), transparent 58%),
                  radial-gradient(ellipse 40% 30% at 16% 88%, rgba(26,21,64,.5), transparent 55%), var(--midnight); }
    #snow { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; opacity: .55; }
    .app { position: relative; z-index: 2; min-height: 100dvh; }
    .chrome { position: sticky; top: 0; z-index: 20; border-bottom: 1px solid rgba(42,51,72,.7); background: rgba(7,11,20,.9); backdrop-filter: blur(12px); padding: .45rem .75rem; }
    .chrome-inner { display: flex; align-items: center; gap: .5rem; max-width: 64rem; margin: 0 auto; }
    .mark-btn { width: 2.75rem; height: 2.75rem; border-radius: 999px; border: 1px solid var(--border); overflow: hidden; background: var(--midnight); padding: 0; }
    .tabs { display: flex; gap: .15rem; flex: 1; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--graphite); }
    .tabs button { background: none; border: 0; color: inherit; padding: .55rem .7rem; min-height: 44px; border-radius: 999px; }
    .tabs button.on { color: var(--frost); background: var(--surface); }
    .quiet { background: none; border: 0; color: var(--graphite); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; min-height: 44px; }
    .page { max-width: 64rem; margin: 0 auto; padding: 1.25rem 1rem 4rem; }
    h1.serif { font-size: clamp(1.8rem, 4vw, 2.4rem); margin: .2rem 0 .4rem; }
    .muted { color: var(--graphite); }
    .caps { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--graphite); }
    .card { border: 1px solid var(--border); border-radius: 1rem; padding: 1.1rem 1.15rem; background: rgba(18,24,42,.82); margin-top: .85rem; }
    .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 999px; padding: .65rem 1.15rem; font-weight: 600; font-size: .92rem; border: 1px solid transparent; }
    .btn-primary { background: var(--ice-violet); color: var(--midnight); }
    .btn-ghost { background: transparent; border-color: var(--border); color: var(--frost); }
    .chip { min-height: 44px; border-radius: 10px; border: 1px solid var(--border); background: transparent; color: var(--frost); padding: .6rem .8rem; text-align: left; }
    .chip.on { border-color: var(--ice-violet); background: rgba(167,139,250,.18); }
    .chips { display: flex; flex-wrap: wrap; gap: .5rem; }
    .likert { display: grid; grid-template-columns: repeat(2, 1fr); gap: .5rem; }
    @media (min-width: 640px) { .likert { grid-template-columns: repeat(4, 1fr); } }
    .flake-grid { display: grid; gap: 2rem; }
    @media (min-width: 900px) { .flake-grid { grid-template-columns: 1fr 1fr; align-items: start; } }
    .voices { display: grid; gap: .6rem; margin-top: 1rem; }
    .voice { border-left: 2px solid var(--ice-violet); padding: .35rem 0 .35rem .8rem; font-size: .92rem; color: var(--graphite); }
    .voice b { color: var(--ice-violet); font-weight: 600; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; display: block; margin-bottom: .2rem; }
    @media (prefers-reduced-motion: reduce) { #snow { display: none; } }
  </style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<div class="glow"></div>
<div class="app">
  <header class="chrome">
    <div class="chrome-inner">
      <button type="button" class="mark-btn" data-go="me" aria-label="Me" id="compact-flake"></button>
      <nav class="tabs" aria-label="Primary">
        <button type="button" data-go="me" id="tab-me">Me</button>
        <button type="button" data-go="insights" id="tab-insights">Insights</button>
        <button type="button" data-go="finds" id="tab-finds">Finds</button>
        <button type="button" data-go="others" id="tab-others">Others</button>
      </nav>
      <button type="button" class="quiet" id="sound-btn">Sound</button>
      <button type="button" class="quiet" id="clear-btn">Clear</button>
    </div>
  </header>
  <audio id="ambient" loop preload="metadata" src="/assets/audio/frost-waltz-kevin-macleod.mp3"></audio>
  <div id="page" class="page"></div>
</div>
<script>
(function () {
  const KEY = "soulflake.v1";
  const BANDS = [
    { id: "taste", label: "Taste", color: "#67E8F9", angle: -90 },
    { id: "traits", label: "Traits", color: "#A78BFA", angle: -30 },
    { id: "bond", label: "Bond", color: "#93C5FD", angle: 30 },
    { id: "conflict", label: "Conflict", color: "#E2E8F0", angle: 150 },
    { id: "values", label: "Values", color: "#C4B5FD", angle: 210 },
    { id: "context", label: "Context", color: "#94A3B8", angle: 90 },
  ];
  const TASTE_GROUPS = [
    { label: "Music", chips: ["Radiohead","Talking Heads","Nina Simone","The Shins","Nirvana","Queen","White Stripes","Joni Mitchell","Eddie Vedder"] },
    { label: "Film", chips: ["Arrival","Lynch","The Matrix","Fight Club","Scent of a Woman","Hereditary","Waking Life","Dead Poets Society","Ex Machina"] },
    { label: "Talk / night", chips: ["Alan Watts","Jordan Peterson","Sarah Silverman","Pesto","Hike that becomes a debate","Empty museum","Ramen at midnight"] },
  ];
  const LIKERT = [{ value: 1, label: "No" }, { value: 2, label: "A little" }, { value: 3, label: "Often" }, { value: 4, label: "That’s me" }];
  const TRAIT_ITEMS = [
    { id: "open", q: "Strange art, strange food, strange ideas feel like oxygen." },
    { id: "extra", q: "A room with people in it gives me energy more often than it costs me." },
    { id: "cons", q: "I finish the last 10% even when the idea is already bored of me." },
    { id: "agree", q: "I give people the benefit of the doubt, even when it costs me." },
    { id: "neuro", q: "Small slights stay in my body longer than I want them to." },
  ];
  const BOND_ITEMS = [
    { id: "ending", q: "When someone I care about goes quiet, I start writing the ending." },
    { id: "chase", q: "After a fight I go quiet. I do not chase." },
    { id: "focus", q: "When I am deep in a thing, closeness can feel like an interruption." },
    { id: "want", q: "I want more contact than the other person usually wants to give." },
  ];
  const VALUE_ITEMS = [
    { id: "course", q: "When it counts I protect…", a: "My own course", b: "A stable ground" },
    { id: "fair", q: "When it counts I protect…", a: "Fairness", b: "Leverage" },
    { id: "truth", q: "When it counts I protect…", a: "The blunt truth", b: "The relationship" },
    { id: "free", q: "When it counts I protect…", a: "Freedom to leave", b: "Belonging" },
  ];
  const CONFLICT_ITEMS = [
    { id: "late", q: "They’re late again with a thin apology. Your first move:", options: ["Name the pattern", "Go quiet", "Joke it off, bring it up later"] },
    { id: "heat", q: "The room is heating up. You:", options: ["Stay in it and say the hard line", "Leave and cool off", "Soften so nobody explodes"] },
    { id: "repair", q: "The next morning, you:", options: ["Text first and own your part", "Wait for them", "Act like nothing happened until they do"] },
  ];
  const CONTEXT_ITEMS = [
    { id: "faith", q: "Faith, as lived. Skip allowed.", options: ["Skip", "Christian", "Other faith", "None / unsure"] },
    { id: "place", q: "Where you are, roughly.", options: ["Skip", "West Coast US", "Other US", "Outside the US"] },
  ];
  const COPY = {
    taste: { title: "Taste", lead: "Pick what feels like you. Skip the rest." },
    traits: { title: "Traits", lead: "How you move. Not a type." },
    bond: { title: "Bond", lead: "How you get close. Not a diagnosis." },
    values: { title: "Values", lead: "When it counts, what do you protect?" },
    conflict: { title: "Conflict", lead: "What you do when it heats up." },
    context: { title: "Context", lead: "Facts as you name them. Skip allowed." },
  };
  const JUSTIN = {
    id: "sf-justin", born: true, name: "Justin",
    answers: {
      taste: ["Lynch","The Matrix","Fight Club","Scent of a Woman","Hereditary","The Shins","Talking Heads","Nirvana","Queen","White Stripes","Alan Watts","Jordan Peterson","Sarah Silverman","Pesto","Hike that becomes a debate"],
      traits: { open: 4, extra: 4, cons: 2, agree: 2, neuro: 2 },
      bond: { ending: 2, chase: 4, focus: 3, want: 2 },
      values: {},
      conflict: { late: "Go quiet", heat: "Leave and cool off" },
      context: { faith: "Christian", place: "West Coast US" },
    },
  };

  function emptyProfile() {
    return { id: "sf-" + Math.random().toString(36).slice(2, 8), born: false, name: "",
      answers: { taste: [], traits: {}, bond: {}, values: {}, conflict: {}, context: {} } };
  }
  function bandLevel(p, id) {
    const a = p.answers;
    if (id === "taste") return Math.min(3, Math.ceil(a.taste.length / 3));
    const bag = id === "traits" ? a.traits : id === "bond" ? a.bond : id === "values" ? a.values : id === "conflict" ? a.conflict : a.context;
    const n = Object.keys(bag).filter((k) => bag[k] !== "" && bag[k] !== "Skip").length;
    if (n === 0) return 0;
    if (n === 1) return 1;
    if (n <= 3) return 2;
    return 3;
  }
  function levelWord(n) { return n === 0 ? "frost" : n === 1 ? "branching" : n === 2 ? "forming" : "fine"; }
  function high(n) { return (n ?? 0) >= 3; }
  function low(n) { return (n ?? 0) > 0 && (n ?? 0) <= 2; }
  function flakeTitle(p) {
    const t = p.answers.traits;
    if (!Object.keys(t).length) return p.name || "Me";
    if (high(t.open) && high(t.extra)) return "Curious, outgoing";
    if (high(t.open) && low(t.cons)) return "Idea-first";
    if (high(t.cons) && low(t.open)) return "Finishes the last 10%";
    if (high(t.agree)) return "Gives the benefit";
    if (high(t.neuro)) return "Feels it in the body";
    return p.name || "Me";
  }
  function aboutLines(p) {
    const lines = [];
    const a = p.answers;
    if (a.taste.length) lines.push("Taste: " + a.taste.slice(0, 8).join(", ") + ".");
    const t = a.traits; const bits = [];
    if (high(t.open)) bits.push("very curious"); else if (low(t.open)) bits.push("likes the known");
    if (high(t.extra)) bits.push("outgoing"); else if (low(t.extra)) bits.push("rooms cost energy");
    if (high(t.cons)) bits.push("finishes things"); else if (low(t.cons)) bits.push("average at finishing");
    if (high(t.agree)) bits.push("gives the benefit"); else if (low(t.agree)) bits.push("cooler than warm");
    if (high(t.neuro)) bits.push("slights linger");
    if (bits.length) lines.push("How you move: " + bits.join(". ") + ".");
    if (high(a.bond.chase)) lines.push("After a fight: quiet, no chase.");
    else if (low(a.bond.chase) && a.bond.chase) lines.push("After a fight you do not stay quiet.");
    if (high(a.bond.ending)) lines.push("Silence from someone close makes you write the ending.");
    if (high(a.bond.focus)) lines.push("When you are deep in a thing, closeness can feel like an interruption.");
    const vals = Object.values(a.values);
    if (vals.length) lines.push("You protect: " + vals.join(", ") + ".");
    if (a.conflict.late) lines.push("First move when they’re late: " + a.conflict.late + ".");
    if (a.conflict.heat) lines.push("When the room heats: " + a.conflict.heat + ".");
    if (a.conflict.repair) lines.push("Next morning: " + a.conflict.repair + ".");
    if (a.context.faith && a.context.faith !== "Skip") lines.push("Faith as named: " + a.context.faith + ".");
    const frost = BANDS.filter((b) => bandLevel(p, b.id) === 0).map((b) => b.label);
    if (frost.length) lines.push("Still frost: " + frost.join(", ") + ".");
    if (!lines.length) lines.push("Skeleton only. Tap an arm. Uneven is allowed.");
    return lines;
  }
  function voices(p) {
    const out = [];
    const t = p.answers.traits;
    const taste = p.answers.taste;
    if (taste.length) {
      const night = taste.find((x) => /hike|ramen|museum|omakase/i.test(x)) ?? taste[0];
      out.push({ who: "What works", line: "Lead with " + night + ". That is already on your list." });
    }
    if (high(p.answers.bond.chase)) out.push({ who: "What costs you", line: "After a fight you go quiet and stay there. The other person is left to chase." });
    else if (high(p.answers.bond.ending)) out.push({ who: "What costs you", line: "Silence from them and you start writing the ending. Say that out loud before you decide it’s over." });
    else if (high(t.neuro)) out.push({ who: "What costs you", line: "Small slights stay in your body. Name them the same day or they rot." });
    if (p.answers.conflict.repair) {
      out.push({ who: "Tuesday", line:
        p.answers.conflict.repair === "Text first and own your part" ? "You already said you text first. Do that before noon."
        : p.answers.conflict.repair === "Wait for them" ? "Waiting until they move first is the pattern. If you want it repaired, you go first once."
        : "Acting like nothing happened only works if they play along. They often don’t." });
    }
    return out.slice(0, 3);
  }

  let profile = emptyProfile();
  try { const raw = localStorage.getItem(KEY); if (raw) profile = Object.assign(emptyProfile(), JSON.parse(raw)); } catch (e) {}
  function persist() { localStorage.setItem(KEY, JSON.stringify(profile)); }

  let view = "me";
  let openBand = null;

  function flakeSvg(p, born, compact) {
    const CX = 200, CY = 200, LABEL_R = 168;
    const polar = (deg, r) => { const a = deg * Math.PI / 180; return { x: CX + r * Math.cos(a), y: CY + r * Math.sin(a) }; };
    const arms = BANDS.map((b) => {
      const n = born ? bandLevel(p, b.id) : 0;
      const len = 62 + n * 18;
      const tip = polar(b.angle, len);
      const hit = polar(b.angle, 78);
      const w = compact ? 3.2 + n * 1.2 : 2.2 + n * 1.15;
      const op = !born ? 0.22 : n === 0 ? 0.4 : 1;
      const perp = b.angle + 90;
      const br1 = polar(b.angle, len * 0.52);
      const off1 = 14;
      const bA = { x: br1.x + off1 * Math.cos(perp * Math.PI / 180), y: br1.y + off1 * Math.sin(perp * Math.PI / 180) };
      const bB = { x: br1.x - off1 * Math.cos(perp * Math.PI / 180), y: br1.y - off1 * Math.sin(perp * Math.PI / 180) };
      const br2 = polar(b.angle, len * 0.78);
      const off2 = 18;
      const bC = { x: br2.x + off2 * Math.cos(perp * Math.PI / 180), y: br2.y + off2 * Math.sin(perp * Math.PI / 180) };
      const bD = { x: br2.x - off2 * Math.cos(perp * Math.PI / 180), y: br2.y - off2 * Math.sin(perp * Math.PI / 180) };
      const label = polar(b.angle, LABEL_R);
      let extra = "";
      if (born && n >= 1) extra += `<line x1="${br1.x}" y1="${br1.y}" x2="${bA.x}" y2="${bA.y}" stroke="${b.color}" stroke-width="1.25" stroke-linecap="round"/><line x1="${br1.x}" y1="${br1.y}" x2="${bB.x}" y2="${bB.y}" stroke="${b.color}" stroke-width="1.25" stroke-linecap="round"/>`;
      if (born && n >= 2) extra += `<line x1="${br2.x}" y1="${br2.y}" x2="${bC.x}" y2="${bC.y}" stroke="${b.color}" stroke-width="1.15" stroke-linecap="round"/><line x1="${br2.x}" y1="${br2.y}" x2="${bD.x}" y2="${bD.y}" stroke="${b.color}" stroke-width="1.15" stroke-linecap="round"/>`;
      const text = compact ? "" : `<text x="${label.x}" y="${label.y}" text-anchor="middle" dominant-baseline="middle" fill="#94a3b8" font-size="11" letter-spacing="0.16em">${b.label}</text>`;
      const hitc = born && !compact ? `<circle cx="${hit.x}" cy="${hit.y}" r="26" fill="transparent" style="cursor:pointer" data-arm="${b.id}"></circle>` : "";
      return `<g style="opacity:${op}"><line x1="${CX}" y1="${CY}" x2="${tip.x}" y2="${tip.y}" stroke="${b.color}" stroke-width="${w}" stroke-linecap="round"/>${extra}${text}${hitc}</g>`;
    }).join("");
    const vb = compact ? "90 90 220 220" : "0 0 400 400";
    const coreClick = born ? "" : ' data-birth="1" style="cursor:pointer"';
    return `<svg viewBox="${vb}" role="img" aria-label="Your flake" style="display:block;width:100%;max-width:${compact ? "2.5rem" : "22rem"};margin:0 auto">${arms}<circle cx="${CX}" cy="${CY}" r="20" fill="none" stroke="#67E8F9" stroke-width="1.3" opacity="${born ? 0.45 : 0.95}"/><circle cx="${CX}" cy="${CY}" r="11" fill="#C4B5FD"${coreClick}/></svg>`;
  }
  function chip(on, label, attrs) {
    return `<button type="button" class="chip${on ? " on" : ""}" ${attrs}>${label}</button>`;
  }
  function renderBand(id) {
    const copy = COPY[id];
    let body = "";
    if (id === "taste") {
      body = TASTE_GROUPS.map((g) => `<p class="caps">${g.label}</p><div class="chips">${g.chips.map((c) => chip(profile.answers.taste.includes(c), c, `data-taste="${c}"`)).join("")}</div>`).join("");
    } else if (id === "traits") {
      body = TRAIT_ITEMS.map((item) => `<p>${item.q}</p><div class="likert">${LIKERT.map((o) => chip(profile.answers.traits[item.id] === o.value, o.label, `data-trait="${item.id}" data-n="${o.value}"`)).join("")}</div>`).join("");
    } else if (id === "bond") {
      body = BOND_ITEMS.map((item) => `<p>${item.q}</p><div class="likert">${LIKERT.map((o) => chip(profile.answers.bond[item.id] === o.value, o.label, `data-bond="${item.id}" data-n="${o.value}"`)).join("")}</div>`).join("");
    } else if (id === "values") {
      body = VALUE_ITEMS.map((item) => `<p>${item.q}</p><div class="chips">${chip(profile.answers.values[item.id] === item.a, item.a, `data-val="${item.id}" data-v="${item.a}"`)}${chip(profile.answers.values[item.id] === item.b, item.b, `data-val="${item.id}" data-v="${item.b}"`)}</div>`).join("");
    } else if (id === "conflict") {
      body = CONFLICT_ITEMS.map((item) => `<p>${item.q}</p><div style="display:grid;gap:.5rem">${item.options.map((o) => chip(profile.answers.conflict[item.id] === o, o, `data-conf="${item.id}" data-v="${o}"`)).join("")}</div>`).join("");
    } else if (id === "context") {
      body = `<p>What should we call you?</p><input id="name-in" value="${profile.name || ""}" placeholder="First name" style="min-height:44px;width:100%;border-radius:10px;border:1px solid var(--border);background:var(--midnight);color:var(--frost);padding:0 .75rem" />` +
        CONTEXT_ITEMS.map((item) => `<p>${item.q}</p><div class="likert">${item.options.map((o) => chip(profile.answers.context[item.id] === o, o, `data-ctx="${item.id}" data-v="${o}"`)).join("")}</div>`).join("");
    }
    return `<section class="card"><p class="caps">${id}</p><h2 class="serif">${copy.title}</h2><p class="muted">${copy.lead}</p><div style="margin-top:1rem;display:grid;gap:1rem">${body}</div><button type="button" class="btn btn-ghost" data-close-band style="margin-top:1rem">Climb out</button></section>`;
  }
  function renderMe() {
    const lines = aboutLines(profile);
    const vs = voices(profile);
    let right = "";
    if (openBand) right = renderBand(openBand);
    else if (profile.born) {
      right = `<p class="caps">${profile.id}</p><h1 class="serif">${flakeTitle(profile)}</h1>${lines.map((l) => `<p>${l}</p>`).join("")}
        <p class="muted">${BANDS.map((b) => b.label + " " + levelWord(bandLevel(profile, b.id))).join(" · ")}</p>
        ${vs.length ? `<div class="voices">${vs.map((v) => `<div class="voice"><b>${v.who}</b>${v.line}</div>`).join("")}</div>` : ""}`;
    } else {
      right = `<div class="card"><p class="caps">Me</p><h2 class="serif">Press the center of yourself</h2><p class="muted">Six arms appear. Tap one. Answer. Climb out. The flake stays. You are never done.</p>
        <button type="button" class="btn btn-primary" data-birth="1" style="margin-top:1rem">Press the center</button>
        <button type="button" class="btn btn-ghost" id="load-justin" style="margin-top:.5rem">Load Justin sample</button></div>`;
    }
    return `<p class="caps">Me</p>
      <div class="flake-grid"><div>${flakeSvg(profile, profile.born, false)}${profile.born ? `<p class="muted" style="text-align:center">Tap an arm to dive in. Climb out when you are done.</p>` : ""}</div><div>${right}</div></div>`;
  }
  function renderShell(name, title, body) {
    return `<p class="caps">${name}</p><h1 class="serif">${title}</h1><div class="card"><p class="muted">${body}</p><button type="button" class="btn btn-ghost" data-go="me" style="margin-top:1rem">Back to Me</button></div>`;
  }

  function show(v) {
    view = v;
    openBand = v === "me" ? openBand : null;
    ["me","insights","finds","others"].forEach((id) => {
      const el = document.getElementById("tab-" + id);
      if (el) el.classList.toggle("on", v === id);
    });
    document.getElementById("compact-flake").innerHTML = flakeSvg(profile, profile.born, true);
    const page = document.getElementById("page");
    if (v === "me") page.innerHTML = renderMe();
    else if (v === "insights") page.innerHTML = renderShell("Insights", "Not yet", "This page fills from Me. Carve arms first. Nothing to act on until those answers exist. Not a shop.");
    else if (v === "finds") page.innerHTML = renderShell("Finds", "Not yet", "Nights, rooms, people — later, and only from thick arms. Not a shop. Not a feed.");
    else page.innerHTML = renderShell("Others", "Not yet", "People you already know. Compare later. No compatibility percentage. No type table.");
  }

  document.body.addEventListener("click", (e) => {
    const t = e.target.closest("[data-go],[data-birth],[data-arm],[data-taste],[data-trait],[data-bond],[data-val],[data-conf],[data-ctx],[data-close-band],#load-justin,#clear-btn,#sound-btn");
    if (!t) return;
    if (t.id === "sound-btn") {
      const a = document.getElementById("ambient");
      if (a.paused) { a.volume = 0.28; a.play(); t.textContent = "Sound on"; localStorage.setItem("soulflake-ambient", "on"); }
      else { a.pause(); t.textContent = "Sound"; localStorage.setItem("soulflake-ambient", "off"); }
      return;
    }
    if (t.id === "clear-btn") { profile = emptyProfile(); persist(); openBand = null; show("me"); return; }
    if (t.id === "load-justin") { profile = JSON.parse(JSON.stringify(JUSTIN)); persist(); openBand = null; show("me"); return; }
    if (t.hasAttribute("data-go")) { show(t.getAttribute("data-go")); return; }
    if (t.hasAttribute("data-birth")) { profile.born = true; persist(); show("me"); return; }
    if (t.hasAttribute("data-arm")) { openBand = t.getAttribute("data-arm"); show("me"); return; }
    if (t.hasAttribute("data-close-band")) { openBand = null; show("me"); return; }
    if (t.hasAttribute("data-taste")) {
      const c = t.getAttribute("data-taste");
      const cur = profile.answers.taste;
      profile.answers.taste = cur.includes(c) ? cur.filter((x) => x !== c) : cur.concat(c);
      persist(); show("me"); return;
    }
    if (t.hasAttribute("data-trait")) { profile.answers.traits[t.getAttribute("data-trait")] = Number(t.getAttribute("data-n")); persist(); show("me"); return; }
    if (t.hasAttribute("data-bond")) { profile.answers.bond[t.getAttribute("data-bond")] = Number(t.getAttribute("data-n")); persist(); show("me"); return; }
    if (t.hasAttribute("data-val")) { profile.answers.values[t.getAttribute("data-val")] = t.getAttribute("data-v"); persist(); show("me"); return; }
    if (t.hasAttribute("data-conf")) { profile.answers.conflict[t.getAttribute("data-conf")] = t.getAttribute("data-v"); persist(); show("me"); return; }
    if (t.hasAttribute("data-ctx")) { profile.answers.context[t.getAttribute("data-ctx")] = t.getAttribute("data-v"); persist(); show("me"); return; }
  });
  document.body.addEventListener("input", (e) => {
    if (e.target.id === "name-in") { profile.name = e.target.value; persist(); }
  });

  const audio = document.getElementById("ambient");
  const want = localStorage.getItem("soulflake-ambient") !== "off";
  window.addEventListener("pointerdown", function unlock() {
    if (want && audio.paused) { audio.volume = 0.28; audio.play().then(() => { document.getElementById("sound-btn").textContent = "Sound on"; }).catch(() => {}); }
    window.removeEventListener("pointerdown", unlock);
  }, { once: true });

  (function snow() {
    const canvas = document.getElementById("snow");
    const g = canvas.getContext("2d");
    if (!g) return;
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let w = 0, h = 0, flakes = [];
    function spawn(randomY) {
      return { x: Math.random() * w, y: randomY ? Math.random() * h : -8, r: 0.6 + Math.random() * 1.6, vy: 0.12 + Math.random() * 0.45, vx: -0.12 + Math.random() * 0.24, a: 0.12 + Math.random() * 0.35, tw: Math.random() * Math.PI * 2, tws: 0.01 + Math.random() * 0.02, hue: Math.random() > 0.85 ? "cyan" : "frost" };
    }
    function resize() {
      w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight;
      flakes = Array.from({ length: Math.min(70, Math.floor((w * h) / 22000)) }, () => spawn(true));
    }
    function frame() {
      if (reduce) return;
      g.clearRect(0, 0, w, h);
      for (const f of flakes) {
        f.tw += f.tws; f.x += f.vx + Math.sin(f.tw) * 0.12; f.y += f.vy;
        if (f.y > h + 6 || f.x < -10 || f.x > w + 10) Object.assign(f, spawn(false));
        const alpha = f.a * (0.65 + 0.35 * Math.sin(f.tw));
        g.beginPath();
        g.fillStyle = f.hue === "cyan" ? `rgba(103,232,249,${alpha * 0.5})` : `rgba(248,250,252,${alpha})`;
        g.arc(f.x, f.y, f.r, 0, Math.PI * 2); g.fill();
      }
      requestAnimationFrame(frame);
    }
    resize(); if (!reduce) frame(); window.addEventListener("resize", resize);
  })();

  show("me");
})();
</script>
</body>
</html>
