<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Soulflake — Me</title>
<meta name="theme-color" content="#070B14" />
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{--midnight:#070B14;--violet:#A78BFA;--cyan:#67E8F9;--frost:#F8FAFC;--graphite:#94A3B8;--border:#2a3348;--surface:#12182a}
*{box-sizing:border-box}html,body{margin:0;background:var(--midnight);color:var(--frost);font-family:Inter,system-ui,sans-serif;min-height:100%}
button,input{font-family:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
.serif{font-family:"Instrument Serif",Georgia,serif;font-weight:400}
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 50% 36% at 70% 12%,rgba(167,139,250,.12),transparent 58%),var(--midnight)}
.app{position:relative;z-index:2;min-height:100dvh}
.chrome{position:sticky;top:0;z-index:20;border-bottom:1px solid rgba(42,51,72,.7);background:rgba(7,11,20,.92);backdrop-filter:blur(12px)}
.inner{display:flex;align-items:center;gap:.35rem;max-width:64rem;margin:0 auto;padding:.4rem .7rem}
.who{border:1px solid var(--border);background:var(--surface);color:var(--frost);border-radius:999px;min-height:36px;padding:0 .7rem;font-size:.85rem;max-width:11rem}
.tabs{display:flex;gap:.1rem;flex:1;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--graphite)}
.tabs button,.quiet{background:none;border:0;color:inherit;padding:.5rem .55rem;min-height:44px;border-radius:999px}
.tabs button.on{color:var(--frost);background:var(--surface)}
.page{max-width:64rem;margin:0 auto;padding:1rem .85rem 4rem}
.caps{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--graphite)}
h1.serif{font-size:clamp(1.6rem,3.5vw,2.2rem);margin:.15rem 0 .4rem}
.muted{color:var(--graphite)}
.card{border:1px solid var(--border);border-radius:1rem;padding:1rem;background:rgba(18,24,42,.82);margin-top:.85rem}
.chip{min-height:44px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--frost);padding:.55rem .75rem;text-align:left}
.chip.on{border-color:var(--violet);background:rgba(167,139,250,.18)}
.chips,.likert{display:flex;flex-wrap:wrap;gap:.45rem}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;border-radius:999px;padding:.6rem 1.1rem;font-weight:600;border:1px solid var(--border);background:transparent;color:var(--frost)}
.btn-primary{background:var(--violet);color:var(--midnight);border-color:transparent}
.flake-grid{display:grid;gap:1.5rem}
.flake-cam{overflow:hidden;border-radius:1.2rem;max-width:22rem;margin:0 auto}
.flake-stage{transition:transform 1.15s ease-in-out;transform-origin:50% 50%;will-change:transform}
.flake-stage.zoom{transform:scale(2.2) translate(var(--tx),var(--ty))}
@media(min-width:900px){.flake-grid{grid-template-columns:1fr 1fr;align-items:start}}
.field{min-height:44px;width:100%;border-radius:10px;border:1px solid var(--border);background:var(--midnight);color:var(--frost);padding:0 .75rem}
.list{display:grid;gap:.45rem;margin:.7rem 0}
.scrim{position:fixed;inset:0;z-index:40;background:rgba(7,11,20,.72);display:grid;place-items:center;padding:1rem}
.modal{width:min(22rem,100%);border:1px solid var(--border);border-radius:1.1rem;background:#12182a;padding:1.15rem;box-shadow:0 0 40px rgba(167,139,250,.18)}
.modal h2{margin:.2rem 0 .35rem}
.modal .row{display:flex;gap:.45rem;flex-wrap:wrap;margin-top:1rem}
</style>
</head>
<body>
<div class="glow"></div>
<div class="app">
<header class="chrome"><div class="inner">
  <button type="button" class="who" id="who-btn" data-go="switch">Navigation</button>
  <nav class="tabs" aria-label="Primary">
    <button type="button" data-go="welcome" id="t-welcome">Welcome</button>
    <button type="button" data-go="me" id="t-me">Me</button>
    <button type="button" data-go="insights" id="t-insights">Insights</button>
    <button type="button" data-go="finds" id="t-finds">Finds</button>
    <button type="button" data-go="others" id="t-others">Others</button>
  </nav>
  <button type="button" class="quiet" id="export-btn">Export</button>
</div></header>
<div id="page" class="page"></div>
<div id="modal-root"></div>
</div>
<script>
(function(){
var STORE="soulflake.profiles.v1";
var OLD="soulflake.v1";
var BANDS=[
  {id:"taste",label:"Taste",color:"#67E8F9",angle:-90},
  {id:"traits",label:"Traits",color:"#A78BFA",angle:-30},
  {id:"bond",label:"Bond",color:"#93C5FD",angle:30},
  {id:"conflict",label:"Conflict",color:"#E2E8F0",angle:150},
  {id:"values",label:"Values",color:"#C4B5FD",angle:210},
  {id:"context",label:"Context",color:"#94A3B8",angle:90}
];
var TASTE=["Radiohead","Talking Heads","Nina Simone","The Shins","Nirvana","Queen","White Stripes","Lynch","The Matrix","Fight Club","Arrival","Pesto","Alan Watts","Hike that becomes a debate","Ramen at midnight"];
var L=[{v:1,l:"No"},{v:2,l:"A little"},{v:3,l:"Often"},{v:4,l:"That’s me"}];
var TRAITS=[{id:"open",q:"Strange art and ideas feel like oxygen."},{id:"extra",q:"A room with people gives me energy more than it costs."},{id:"cons",q:"I finish the last 10% even when I’m bored of the idea."},{id:"agree",q:"I give people the benefit of the doubt."},{id:"neuro",q:"Small slights stay in my body."}];
var BOND=[{id:"ending",q:"When someone close goes quiet, I start writing the ending."},{id:"chase",q:"After a fight I go quiet. I do not chase."},{id:"focus",q:"When I am deep in a thing, closeness can feel like an interruption."}];
var VALS=[{id:"course",a:"My own course",b:"A stable ground"},{id:"truth",a:"The blunt truth",b:"The relationship"}];
var CONF=[{id:"late",q:"They’re late again.",o:["Name the pattern","Go quiet","Joke it off"]},{id:"heat",q:"The room is heating up.",o:["Stay and say the hard line","Leave and cool off","Soften so nobody explodes"]},{id:"repair",q:"The next morning.",o:["Text first and own your part","Wait for them","Act like nothing happened"]}];
var CTX=[{id:"faith",q:"Faith, as lived.",o:["Skip","Christian","Other faith","None / unsure"]},{id:"place",q:"Where you are.",o:["Skip","West Coast US","Other US","Outside the US"]}];
var COPY={taste:{t:"Taste",l:"Pick what feels like you."},traits:{t:"Traits",l:"How you move. Not a type."},bond:{t:"Bond",l:"How you get close."},values:{t:"Values",l:"When it counts, what do you protect?"},conflict:{t:"Conflict",l:"What you do when it heats up."},context:{t:"Context",l:"Facts as you name them. Skip allowed."}};
function uid(){return "sf-"+Math.random().toString(36).slice(2,8);}
function blank(name){return {id:uid(),born:false,name:name||"",answers:{taste:[],traits:{},bond:{},values:{},conflict:{},context:{}}};}
function loadStore(){
  try{ var s=JSON.parse(localStorage.getItem(STORE)||"null"); if(s&&s.profiles&&s.profiles.length) return s; }catch(e){}
  var migrated=null; try{ migrated=JSON.parse(localStorage.getItem(OLD)||"null"); }catch(e){}
  if(migrated&&migrated.answers){ if(migrated.id==="sf-justin") migrated.id=uid(); if(!migrated.name) migrated.name=""; return {activeId:migrated.id,profiles:[migrated]}; }
  var p=blank(""); return {activeId:p.id,profiles:[p]};
}
var store=loadStore();
function persist(){ localStorage.setItem(STORE, JSON.stringify(store)); }
function profile(){ return store.profiles.filter(function(p){return p.id===store.activeId;})[0]||store.profiles[0]; }
function setActive(id){ store.activeId=id; persist(); }
function lvl(id){
  var a=profile().answers;
  if(id==="taste") return Math.min(3,Math.ceil((a.taste||[]).length/3));
  var bag=a[id]||{}; var n=Object.keys(bag).filter(function(k){return bag[k]&&bag[k]!=="Skip";}).length;
  return n===0?0:n===1?1:n<=3?2:3;
}
function word(n){return n===0?"frost":n>=3?"fine":"forming";}
function hi(n){return (n||0)>=3;} function lo(n){return (n||0)>0&&(n||0)<=2;}
function flakeTitle(){
  var p=profile(), t=p.answers.traits||{};
  if(p.name) return p.name;
  if(!Object.keys(t).length) return "Me";
  if(hi(t.open)&&hi(t.extra)) return "Curious, outgoing";
  if(hi(t.open)&&lo(t.cons)) return "Idea-first";
  return "Me";
}
function about(){
  var a=profile().answers, lines=[], t=a.traits||{}, bits=[];
  if((a.taste||[]).length) lines.push("Taste: "+a.taste.slice(0,8).join(", ")+".");
  if(hi(t.open)) bits.push("very curious"); else if(lo(t.open)) bits.push("likes the known");
  if(hi(t.extra)) bits.push("outgoing"); else if(lo(t.extra)) bits.push("rooms cost energy");
  if(hi(t.cons)) bits.push("finishes things"); else if(lo(t.cons)) bits.push("average at finishing");
  if(hi(t.agree)) bits.push("gives the benefit"); else if(lo(t.agree)) bits.push("cooler than warm");
  if(hi(t.neuro)) bits.push("slights linger");
  if(bits.length) lines.push("How you move: "+bits.join(". ")+".");
  if(hi((a.bond||{}).chase)) lines.push("After a fight: quiet, no chase.");
  if(hi((a.bond||{}).ending)) lines.push("Silence from someone close makes you write the ending.");
  var vals=Object.values(a.values||{});
  if(vals.length) lines.push("You protect: "+vals.join(", ")+".");
  if(a.conflict&&a.conflict.heat) lines.push("When the room heats: "+a.conflict.heat+".");
  if(a.context&&a.context.faith&&a.context.faith!=="Skip") lines.push("Faith as named: "+a.context.faith+".");
  var frost=BANDS.filter(function(b){return lvl(b.id)===0;}).map(function(b){return b.label;});
  if(frost.length) lines.push("Still frost: "+frost.join(", ")+".");
  if(!lines.length) lines.push("Skeleton only. Tap an arm. Uneven is allowed.");
  return lines;
}
function flakeSvg(born){
  var CX=200,CY=200;
  function polar(deg,r){var a=deg*Math.PI/180;return {x:CX+r*Math.cos(a),y:CY+r*Math.sin(a)};}
  var arms=BANDS.map(function(b){
    var n=born?lvl(b.id):0, len=62+n*18, tip=polar(b.angle,len), hit=polar(b.angle,80), lab=polar(b.angle,168);
    var w=2.2+n*1.15, op=!born?0.35:1;
    var hitc=born?'<circle cx="'+hit.x+'" cy="'+hit.y+'" r="26" fill="transparent" style="cursor:pointer" data-arm="'+b.id+'"></circle>':"";
    var text='<text x="'+lab.x+'" y="'+lab.y+'" text-anchor="middle" dominant-baseline="middle" fill="#F8FAFC" font-size="13" font-weight="600" letter-spacing="0.08em" style="cursor:pointer" data-arm="'+b.id+'">'+b.label+'</text>';
    return '<g style="opacity:'+op+'"><line x1="'+CX+'" y1="'+CY+'" x2="'+tip.x+'" y2="'+tip.y+'" stroke="'+b.color+'" stroke-width="'+w+'" stroke-linecap="round"/>'+text+hitc+'</g>';
  }).join("");
  var core=born?"":' data-birth="1" style="cursor:pointer"';
  return '<svg viewBox="0 0 400 400" role="img" aria-label="Your flake" style="display:block;width:100%">'+arms+
    '<circle cx="200" cy="200" r="28" fill="transparent" style="cursor:pointer" data-zoom-out="1"></circle>'+
    '<circle cx="200" cy="200" r="20" fill="none" stroke="#67E8F9" stroke-width="1.3" opacity="'+(born?0.45:0.95)+'"/><circle cx="200" cy="200" r="11" fill="#C4B5FD"'+core+'/></svg>';
}
function chip(on,label,attrs){return '<button type="button" class="chip'+(on?" on":"")+'" '+attrs+'>'+label+'</button>';}
var view="me", openBand=null, qIndex=0, zoomingIn=false;
function bandItems(id){
  if(id==="taste") return TASTE.map(function(c){return {kind:"taste",q:"Is this you?", item:c};});
  if(id==="traits") return TRAITS.map(function(item){return {kind:"likert",bag:"traits",id:item.id,q:item.q};});
  if(id==="bond") return BOND.map(function(item){return {kind:"likert",bag:"bond",id:item.id,q:item.q};});
  if(id==="values") return VALS.map(function(item){return {kind:"pair",id:item.id,q:"When it counts I protect…",a:item.a,b:item.b};});
  if(id==="conflict") return CONF.map(function(item){return {kind:"pick",bag:"conflict",id:item.id,q:item.q,o:item.o};});
  if(id==="context") return [{kind:"name",q:"What should we call you?"}].concat(CTX.map(function(item){return {kind:"pick",bag:"context",id:item.id,q:item.q,o:item.o};}));
  return [];
}
function renderBand(id){
  var p=profile(), items=bandItems(id);
  if(qIndex<0) qIndex=0; if(qIndex>=items.length) qIndex=items.length-1;
  var item=items[qIndex], body="", n=items.length, step=(qIndex+1)+" of "+n;
  if(item.kind==="taste"){ var on=(p.answers.taste||[]).indexOf(item.item)>=0; body="<p>"+item.q+"</p><h3 class=\"serif\">"+item.item+"</h3><div class=\"chips\">"+chip(on,"Yes, me",'data-taste="'+item.item+'"')+chip(false,"Not this",'data-skip="1"')+"</div>"; }
  if(item.kind==="likert") body="<p>"+item.q+'</p><div class="likert">'+L.map(function(o){return chip(p.answers[item.bag][item.id]===o.v,o.l,'data-k="'+item.bag+'" data-id="'+item.id+'" data-n="'+o.v+'"');}).join("")+"</div>";
  if(item.kind==="pair") body="<p>"+item.q+'</p><div class="chips">'+chip(p.answers.values[item.id]===item.a,item.a,'data-k="values" data-id="'+item.id+'" data-v="'+item.a+'"')+chip(p.answers.values[item.id]===item.b,item.b,'data-k="values" data-id="'+item.id+'" data-v="'+item.b+'"')+"</div>";
  if(item.kind==="pick") body="<p>"+item.q+'</p><div class="chips">'+item.o.map(function(o){return chip(p.answers[item.bag][item.id]===o,o,'data-k="'+item.bag+'" data-id="'+item.id+'" data-v="'+o+'"');}).join("")+"</div>";
  if(item.kind==="name") body='<p>'+item.q+'</p><input class="field" id="name-in" value="'+(p.name||"")+'" placeholder="Your name on this phone" /><button type="button" class="btn" data-skip="1" style="margin-top:.7rem">Next</button>';
  return '<section class="card"><p class="caps">'+COPY[id].t+' · '+step+' · '+word(lvl(id))+'</p><h2 class="serif">'+COPY[id].t+'</h2><p class="muted">'+COPY[id].l+' One at a time.</p><div style="margin-top:1rem;display:grid;gap:1rem">'+body+'</div><button type="button" class="btn" data-close-band style="margin-top:1rem">Back</button></section>';
}
function renderMe(){
  var p=profile(); var right;
  if(openBand) right=renderBand(openBand);
  else if(p.born){ right='<p class="caps">'+p.id+'</p><h1 class="serif">'+flakeTitle()+'</h1>'+about().map(function(l){return "<p>"+l+"</p>";}).join("")+'<p class="muted">'+BANDS.map(function(b){return b.label+" "+word(lvl(b.id));}).join(" · ")+'</p>'; }
  else { right='<div class="card"><p class="caps">Me</p><h2 class="serif">Press the center of yourself</h2><p class="muted">Name this flake. Six arms appear. Tap one.</p><input class="field" id="birth-name" placeholder="Your name" value="'+(p.name||"")+'" style="margin:1rem 0" /><button type="button" class="btn btn-primary" data-birth="1">Press the center</button></div>'; }
  var cam='', stage='flake-stage';
  if(openBand){ var b=BANDS.filter(function(x){return x.id===openBand;})[0]; var rad=b.angle*Math.PI/180; cam=' style="--tx:'+(-Math.cos(rad)*28)+'%;--ty:'+(-Math.sin(rad)*28)+'%"'; if(!zoomingIn) stage+=' zoom'; }
  return '<p class="caps">Me</p><div class="flake-grid"><div class="flake-cam"><div class="'+stage+'"'+cam+'>'+flakeSvg(p.born)+'</div></div>'+(p.born&&!openBand?'<p class="muted" style="text-align:center">Tap an arm. Frost, forming, or fine — no percents.</p>':'')+(openBand?'<p style="text-align:center;margin:.6rem 0 0"><button type="button" class="btn" data-zoom-out="1">Back</button></p>':'')+'<div>'+right+'</div></div>';
}
function renderSwitch(){
  var rows=store.profiles.map(function(p){ var on=p.id===store.activeId?" on":""; return '<button type="button" class="chip'+on+'" data-pick="'+p.id+'">'+(p.name||"Unnamed")+(p.born?"":" · not started")+'</button>'; }).join("");
  return '<p class="caps">This phone</p><h1 class="serif">Named profiles</h1><div class="card"><div class="list">'+rows+'</div><input class="field" id="new-name" placeholder="Name for a new flake" style="margin:1rem 0 .6rem" /><button type="button" class="btn btn-primary" id="add-profile">Add profile</button><button type="button" class="btn" data-go="me" style="margin-left:.4rem">Back to Me</button></div>';
}
function renderShell(name,title,body){ return '<p class="caps">'+name+'</p><h1 class="serif">'+title+'</h1><div class="card"><p class="muted">'+body+'</p><button type="button" class="btn" data-go="me" style="margin-top:1rem">Back to Me</button></div>'; }
function show(v){
  view=v;
  if(v==="welcome"){ location.href="index.html"; return; }
  ["welcome","me","insights","finds","others"].forEach(function(id){ var el=document.getElementById("t-"+id); if(el) el.classList.toggle("on", v===id); });
  document.getElementById("who-btn").textContent="Navigation";
  document.getElementById("export-btn").hidden = (v!=="me");
  var page=document.getElementById("page");
  if(v==="me"){
    page.innerHTML=renderMe();
    if(openBand && zoomingIn){ var st=page.querySelector(".flake-stage"); requestAnimationFrame(function(){ requestAnimationFrame(function(){ if(st) st.classList.add("zoom"); zoomingIn=false; }); }); }
    else zoomingIn=false;
  }
  else if(v==="switch") page.innerHTML=renderSwitch();
  else if(v==="insights") page.innerHTML=renderShell("Insights","Not yet","Carve arms first.");
  else if(v==="finds") page.innerHTML=renderShell("Finds","Not yet","Later, from thick arms.");
  else page.innerHTML='<p class="caps">Others</p><h1 class="serif">People you already know</h1><div class="card"><p class="muted">Compare later. No compatibility percentage.</p><button type="button" class="btn btn-primary" id="import-btn" style="margin-top:1rem">Import</button><input id="import-file" type="file" accept=".json,application/json" hidden /><p class="muted" id="import-note" style="margin-top:.7rem"></p></div>';
}
document.body.addEventListener("click",function(e){
  var t=e.target.closest("[data-go],[data-birth],[data-arm],[data-taste],[data-k],[data-close-band],[data-zoom-out],[data-pick],[data-skip],#add-profile");
  if(!t) return;
  if(t.id==="add-profile"){ var n=((document.getElementById("new-name")||{}).value||"").trim(); if(!n){ alert("Name the new flake first."); return; } var p=blank(n); store.profiles.push(p); setActive(p.id); openBand=null; show("me"); return; }
  if(t.hasAttribute("data-pick")){ setActive(t.getAttribute("data-pick")); openBand=null; show("me"); return; }
  if(t.hasAttribute("data-go")){ var g=t.getAttribute("data-go"); if(g==="me") openBand=null; show(g); return; }
  if(t.hasAttribute("data-birth")){ var p=profile(); var n=((document.getElementById("birth-name")||{}).value||p.name||"").trim(); if(!n){ alert("Name this flake first."); return; } p.name=n; p.born=true; persist(); show("me"); return; }
  if(t.hasAttribute("data-arm")){ openBand=t.getAttribute("data-arm"); qIndex=0; zoomingIn=true; show("me"); return; }
  if(t.hasAttribute("data-close-band")||t.hasAttribute("data-zoom-out")){ openBand=null; show("me"); return; }
  if(t.hasAttribute("data-skip")){ var items=bandItems(openBand); if(qIndex<items.length-1) qIndex++; else openBand=null; show("me"); return; }
  if(t.hasAttribute("data-taste")){ var c=t.getAttribute("data-taste"), cur=profile().answers.taste||[]; if(cur.indexOf(c)<0) profile().answers.taste=cur.concat(c); persist(); var items=bandItems(openBand); if(qIndex<items.length-1) qIndex++; else openBand=null; show("me"); return; }
  if(t.hasAttribute("data-k")){ var k=t.getAttribute("data-k"), id=t.getAttribute("data-id"); if(t.hasAttribute("data-n")) profile().answers[k][id]=Number(t.getAttribute("data-n")); else profile().answers[k][id]=t.getAttribute("data-v"); persist(); var items=bandItems(openBand); if(qIndex<items.length-1) qIndex++; else openBand=null; show("me"); return; }
});
document.body.addEventListener("input",function(e){ if(e.target.id==="name-in"||e.target.id==="birth-name"){ profile().name=e.target.value; persist(); } });
var HOUSE="Ice Laboratory \u00b7 Soulflake \u00b7 070B14 \u00b7 JTNOVA";
function keyBytes(pass){ return crypto.subtle.digest("SHA-256", new TextEncoder().encode(pass)).then(function(buf){ return new Uint8Array(buf); }); }
function xor(bytes, key){ var out=new Uint8Array(bytes.length); for(var i=0;i<bytes.length;i++) out[i]=bytes[i]^key[i%key.length]; return out; }
function b64(bytes){ var s=""; for(var i=0;i<bytes.length;i++) s+=String.fromCharCode(bytes[i]); return btoa(s); }
function unb64(str){ var s=atob(str), out=new Uint8Array(s.length); for(var i=0;i<s.length;i++) out[i]=s.charCodeAt(i); return out; }
function slug(s){ return String(s||"soulflake").replace(/[^a-zA-Z0-9._-]+/g,"-").replace(/-+/g,"-").replace(/^-|-$/g,"")||"soulflake"; }
function lockProfile(profile, fileName, pass){
  var raw=new TextEncoder().encode(JSON.stringify(profile));
  return keyBytes(HOUSE).then(function(house){ var bytes=xor(raw, house); var locked=!!(pass&&pass.length); var next=locked?keyBytes(pass).then(function(pk){ return xor(bytes, pk); }):Promise.resolve(bytes); return next.then(function(finalBytes){ return {v:2,kind:"soulflake-profile",cipher:"house-v1",locked:locked,name:fileName||profile.name||"Flake",payload:b64(finalBytes)}; }); });
}
function unlockFile(pack, pass){
  var bytes=unb64(pack.payload);
  var first=pack.locked?keyBytes(pass||"").then(function(pk){ return xor(bytes, pk); }):Promise.resolve(bytes);
  return first.then(function(afterPw){ if(pack.v===1) return JSON.parse(new TextDecoder().decode(afterPw)); return keyBytes(HOUSE).then(function(house){ return JSON.parse(new TextDecoder().decode(xor(afterPw, house))); }); });
}
function closeModal(){ document.getElementById("modal-root").innerHTML=""; }
function openExport(){
  var p=profile(); if(!p||!p.born){ alert("Build a flake first."); return; }
  document.getElementById("modal-root").innerHTML='<div class="scrim" id="scrim"><div class="modal"><p class="caps">Export</p><h2 class="serif">Name this file</h2><p class="muted">Password is optional.</p><input class="field" id="ex-name" value="'+(p.name||"")+'" placeholder="Name" style="margin:.8rem 0 .5rem" /><input class="field" id="ex-pass" type="password" placeholder="Password (optional)" /><div class="row"><button type="button" class="btn btn-primary" id="ex-go">Export</button><button type="button" class="btn" id="ex-cancel">Cancel</button></div></div></div>';
}
document.getElementById("export-btn").onclick=function(){ openExport(); };
document.body.addEventListener("click",function(e){
  if(e.target.id==="scrim"||e.target.id==="ex-cancel"){ closeModal(); return; }
  if(e.target.id==="ex-go"){ var p=profile(); var fileName=(document.getElementById("ex-name").value||"").trim()||p.name||"Flake"; lockProfile(p,fileName,document.getElementById("ex-pass").value||"").then(function(pack){ var a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify(pack,null,2)],{type:"application/json"})); a.download=slug(fileName)+".soulflake.json"; a.click(); closeModal(); }); return; }
  if(e.target.id==="import-btn"){ document.getElementById("import-file").click(); return; }
});
document.body.addEventListener("change",function(e){
  if(e.target.id!=="import-file") return;
  var f=e.target.files&&e.target.files[0]; var note=document.getElementById("import-note"); if(!f) return;
  var reader=new FileReader();
  reader.onload=function(){ var pack; try{ pack=JSON.parse(reader.result); }catch(err){ if(note) note.textContent="Not a Soulflake export."; return; } if(!pack||pack.kind!=="soulflake-profile"){ if(note) note.textContent="Not a Soulflake export."; return; } var pw=""; if(pack.locked){ pw=window.prompt("Password for "+(pack.name||"this flake"))||""; if(!pw){ if(note) note.textContent="This file has a password."; return; } } unlockFile(pack,pw).then(function(p){ if(!p.id) p.id=uid(); p.born=true; if(pack.name&&!p.name) p.name=pack.name; store.profiles.push(p); setActive(p.id); show("me"); }).catch(function(){ if(note) note.textContent="Wrong password, or not a house file."; }); };
  reader.readAsText(f);
});
show("me");
})();
</script>
</body>
</html>
