<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Soulflake</title>
<meta name="theme-color" content="#070B14" />
<meta property="og:type" content="website">
<meta property="og:site_name" content="Soulflake">
<meta property="og:title" content="Soulflake">
<meta property="og:description" content="Know thyself, and then be known.">
<meta property="og:url" content="https://soulflake.justinterranova.com/">
<meta property="og:image" content="https://soulflake.justinterranova.com/assets/share-og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Soulflake">
<meta name="twitter:description" content="Know thyself, and then be known.">
<meta name="twitter:image" content="https://soulflake.justinterranova.com/assets/share-og.png">
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="apple-touch-icon" href="assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{--midnight:#070B14;--violet:#A78BFA;--frost:#F8FAFC;--graphite:#94A3B8}
*{box-sizing:border-box}html{margin:0;background:var(--midnight)}body{margin:0;min-height:100%;background:var(--midnight);color:var(--frost);font-family:Inter,system-ui,sans-serif;overflow-x:clip;overflow-y:auto;overscroll-behavior-y:contain}
button{font-family:inherit;cursor:pointer}
.glow{display:none}
.rays,.rays b{position:fixed;inset:0;pointer-events:none;z-index:0}
.rays{background:none;transition:opacity .7s ease}
.rays.away{opacity:0}
.rays b{left:50%;top:-12%;width:7vw;height:88%;background:linear-gradient(180deg, rgba(248,250,252,.22), rgba(103,232,249,.04) 42%, transparent 78%);filter:blur(7px);transform-origin:50% 0;opacity:.38}
.rays b:nth-child(1){transform:translateX(-50%) rotate(-8deg);animation:shimmerRay 7.5s ease-in-out infinite}
.rays b:nth-child(2){transform:translateX(-50%) rotate(0deg);width:5vw;opacity:.28;animation:shimmerRay 9s ease-in-out infinite .8s}
.rays b:nth-child(3){transform:translateX(-50%) rotate(8deg);animation:shimmerRay 8.2s ease-in-out infinite 1.6s}
@keyframes shimmerRay{0%,100%{opacity:.34}50%{opacity:.16}}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.wrap{position:relative;z-index:2;width:min(40rem,calc(100% - 2rem));margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;padding:1.1rem 0}
.wordmark{font-weight:700;font-size:1.25rem;letter-spacing:-.01em;color:#F8FAFC}.wordmark .flake{color:#67E8F9}
.ambient{min-height:44px;border-radius:999px;padding:.45rem .85rem;font-size:.8rem;color:rgba(148,163,184,.55);background:rgba(26,21,64,.28);border:1px solid rgba(248,250,252,.10);opacity:.72;transition:color .4s,background .4s,box-shadow .4s,border-color .4s,opacity .4s}
.ambient.on{color:#F8FAFC;background:rgba(167,139,250,.22);border-color:rgba(167,139,250,.7);opacity:1;box-shadow:0 0 16px rgba(167,139,250,.55)}
.hero{text-align:center;padding:2.4rem 0 2.2rem}
h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:clamp(2.6rem,8vw,4.2rem);letter-spacing:-.03em;margin:0 0 1.1rem;line-height:1.06}
h2{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:clamp(1.9rem,5vw,2.5rem);margin:0 0 .7rem}
.rotate{min-height:3.8rem;max-width:32rem;margin:0 auto 1.7rem;color:var(--graphite);font-size:1.22rem;line-height:1.45;opacity:0;transition:opacity 1.8s linear}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:56px;border-radius:999px;padding:.95rem 1.7rem;font-weight:500;font-size:1.2rem;border:0;background:var(--violet);color:var(--midnight);box-shadow:0 0 22px rgba(167,139,250,.35)}
.mark{width:min(415px,96vw);height:auto;aspect-ratio:1/1;object-fit:contain;display:block;margin:0 auto 1.4rem;background:transparent}
.hero-flake .flake{opacity:0;animation:intro 1.6s ease-out forwards}
.hero-flake .core{transform-origin:0 0;animation:wash 7s ease-in-out infinite;animation-delay:1.6s;animation-fill-mode:both}
.hero-flake .spin-bands{animation:spin-cw 70s linear infinite}
.hero-flake .spin-crystal{animation:spin-ccw 56s linear infinite}
.hero-flake .nucleus{transform:scale(.45)}
.hero-flake .seat,.hero-flake .g0,.hero-flake .g1,.hero-flake .g2,.hero-flake .g3,.hero-flake .g4,.hero-flake .g5,.hero-flake .rg0,.hero-flake .rg1,.hero-flake .rg2,.hero-flake .rg3,.hero-flake .rg4,.hero-flake .rg5{opacity:1;animation-fill-mode:both}
.hero-flake .seat{animation:seat 8s ease-in-out 1.6s infinite}
.hero-flake .g0{animation:wave0 3.8s ease-in-out 1.6s infinite}
.hero-flake .g1{animation:wave1 5.1s ease-in-out 1.6s infinite}
.hero-flake .g2{animation:wave2 6.4s ease-in-out 1.6s infinite}
.hero-flake .g3{animation:wave3 4.4s ease-in-out 2.4s infinite}
.hero-flake .g4{animation:wave4 7.2s ease-in-out 3s infinite}
.hero-flake .g5{animation:wave5 3.2s ease-in-out 3.7s infinite}
.hero-flake .rg0{animation:ring0 4.2s ease-in-out 1.6s infinite}
.hero-flake .rg1{animation:ring1 6s ease-in-out 2s infinite}
.hero-flake .rg2{animation:ring2 3.6s ease-in-out 2.6s infinite}
.hero-flake .rg3{animation:ring3 7s ease-in-out 1.8s infinite}
.hero-flake .rg4{animation:ring4 5.4s ease-in-out 3.2s infinite}
.hero-flake .rg5{animation:ring5 3s ease-in-out 2.3s infinite}
@keyframes intro{from{opacity:0}to{opacity:1}}
@keyframes spin-cw{to{transform:rotate(360deg)}}
@keyframes spin-ccw{to{transform:rotate(-360deg)}}
@keyframes wash{0%,100%{opacity:.08;transform:scale(.78)}50%{opacity:.85;transform:scale(1.14)}}
@keyframes seat{0%,100%{opacity:.45}50%{opacity:.7}}
@keyframes wave0{0%,100%{opacity:.72}50%{opacity:1}}
@keyframes wave1{0%,100%{opacity:.78}50%{opacity:1}}
@keyframes wave2{0%,100%{opacity:1}50%{opacity:.8}}
@keyframes wave3{0%,100%{opacity:.74}50%{opacity:1}}
@keyframes wave4{0%,100%{opacity:.8}50%{opacity:1}}
@keyframes wave5{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes ring0{0%,100%{opacity:.55}50%{opacity:.95}}
@keyframes ring1{0%,100%{opacity:.9}50%{opacity:.6}}
@keyframes ring2{0%,100%{opacity:.65}50%{opacity:1}}
@keyframes ring3{0%,100%{opacity:.85}50%{opacity:.58}}
@keyframes ring4{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes ring5{0%,100%{opacity:1}50%{opacity:.7}}
.hero-flake .n1,.hero-flake .n2,.hero-flake .n3,.hero-flake .n4{transform-origin:0 0}
.hero-flake .n1{animation:flutter1 5.6s ease-in-out 1.6s infinite}
.hero-flake .n2{animation:flutter2 5.6s ease-in-out 1.95s infinite}
.hero-flake .n3{animation:flutter3 5.6s ease-in-out 2.3s infinite}
.hero-flake .n4{animation:flutter4 5.6s ease-in-out 2.65s infinite}
@keyframes flutter1{0%,100%{transform:scale(1);opacity:.88}50%{transform:scale(.96);opacity:1}}
@keyframes flutter2{0%,100%{transform:scale(1);opacity:.82}50%{transform:scale(1.04);opacity:1}}
@keyframes flutter3{0%,100%{transform:scale(1);opacity:.86}50%{transform:scale(.95);opacity:1}}
@keyframes flutter4{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.05);opacity:1}}
.hero-flake .eye{transform-origin:0 0;animation:blink 22s ease-in-out 1.6s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}94.1%,94.4%{transform:scaleY(.06)}94.9%,95.2%{transform:scaleY(1)}95.6%,95.9%{transform:scaleY(.06)}}
@media (prefers-reduced-motion:reduce){.hero-flake .flake,.hero-flake .n1,.hero-flake .n2,.hero-flake .n3,.hero-flake .n4,.hero-flake .eye,.hero-flake .core,.hero-flake .spin-bands,.hero-flake .spin-crystal,.hero-flake .seat,.hero-flake .g0,.hero-flake .g1,.hero-flake .g2,.hero-flake .g3,.hero-flake .g4,.hero-flake .g5,.hero-flake .rg0,.hero-flake .rg1,.hero-flake .rg2,.hero-flake .rg3,.hero-flake .rg4,.hero-flake .rg5{animation:none}.hero-flake .flake,.hero-flake .g0,.hero-flake .g1,.hero-flake .g2,.hero-flake .g3,.hero-flake .g4,.hero-flake .g5,.hero-flake .rg0,.hero-flake .rg1,.hero-flake .rg2,.hero-flake .rg3,.hero-flake .rg4,.hero-flake .rg5,.hero-flake .seat{opacity:1}.hero-flake .core{opacity:.45}}
.hero-flake.me .spin-bands,.hero-flake.me .g1,.hero-flake.me .g2,.hero-flake.me .g3,.hero-flake.me .g4,.hero-flake.me .g5{display:none}
.hero-flake.me .spin-crystal{animation:none}
.hero-flake.me .flake{opacity:1;animation:none}
body.me .pitch,body.me .bottom,body.me .rotate,body.me .vision{display:none}
.pitch{padding:.4rem 0 1.2rem;max-width:none;width:100%;position:relative}
.slide-row{display:flex;align-items:center;gap:1.15rem}
.slide-btn{flex:0 0 2.4rem;height:2.4rem;border-radius:999px;border:1px solid rgba(248,250,252,.16);background:rgba(26,21,64,.35);color:var(--frost);font-size:1.35rem;line-height:1;display:inline-flex;align-items:center;justify-content:center;padding:0}
.slide-btn:hover{border-color:rgba(167,139,250,.55);background:rgba(167,139,250,.18)}
.slides{flex:1;min-width:0;padding:0 .35rem}
.block{margin:0;display:none;align-items:center;gap:1.1rem}
.block.on{display:flex;flex-direction:row-reverse}
.block img,.block svg{width:42%;flex:0 0 42%;height:auto;border-radius:0;margin:0;display:block;background:transparent}
.block .copy{flex:1;min-width:0;text-align:left}
.block .copy h2{margin:0 0 .45rem;font-size:clamp(1.35rem,4.2vw,1.85rem)}
.block .copy p{margin:.35rem 0 0}
.block p{color:var(--graphite);line-height:1.6;margin:.45rem 0 0;font-size:1.05rem}
.dots{display:flex;justify-content:center;gap:.45rem;margin:.85rem 0 0}
.dots button{width:.55rem;height:.55rem;padding:0;border-radius:999px;border:0;background:rgba(148,163,184,.35)}
.dots button.on{background:var(--frost)}
.vision{max-width:36rem;margin:2.6rem auto 1.2rem}
.vision p{color:var(--graphite);line-height:1.65;font-size:1.06rem;margin:.72rem 0}
.vision .fancy{font-family:"Instrument Serif",Georgia,serif;font-weight:400;text-align:center;color:var(--frost);font-size:clamp(1.35rem,3.6vw,1.85rem);line-height:1.28}
.cue{text-align:center;color:var(--frost);font-size:1.18rem;margin:1.4rem 0 1.6rem}
.bottom{text-align:center;padding:0 0 2.4rem}
@media (max-width:640px){.block.on{flex-direction:column;align-items:stretch}.block img,.block svg{width:100%;flex:none}.slide-btn{flex:0 0 2rem;height:2rem;font-size:1.15rem}}
.ground{position:fixed;left:0;right:0;bottom:0;height:22vh;pointer-events:none;z-index:2;background:linear-gradient(180deg, transparent, rgba(248,250,252,.03) 40%, rgba(248,250,252,.07));box-shadow:inset 0 -40px 60px rgba(248,250,252,.04)}
.ground:after{content:"";position:absolute;inset:auto 0 0 0;height:18px;background-image:repeating-linear-gradient(90deg, transparent 0 11px, rgba(248,250,252,.08) 11px 12px, transparent 12px 23px);opacity:.35;mask-image:linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent)}
.flake-stage{position:relative;width:min(415px,96vw);margin:0 auto 1.4rem}
.flake-stage .mark{width:100%;margin:0}
@media (prefers-reduced-motion:reduce){#snow{display:none}.rotate{transition:none}.rays b{animation:none}}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<div class="rays" aria-hidden="true"><b></b><b></b><b></b></div>
<div class="ground" aria-hidden="true"></div>
<audio id="ambient" loop playsinline preload="auto" src="assets/audio/index-Frozen-Star.mp3"></audio>
<div class="wrap top">
  <span class="wordmark">Soul<span class="flake">flake</span></span>
  <button type="button" class="ambient" id="sound" aria-pressed="false">Sound off</button>
</div>
<main class="wrap">
  <section class="hero">
    <div class="flake-stage">
    <svg class="hero-flake mark" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Soulflake">
