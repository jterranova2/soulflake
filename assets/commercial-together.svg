<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Commercial — two flakes">
  <rect width="800" height="400" fill="#070B14"/>
  <defs>
    <filter id="n-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="s-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <polygon id="s-seat" points="0,-11.25 9.74,-5.625 9.74,5.625 0,11.25 -9.74,5.625 -9.74,-5.625"/>
    <g id="s-plate">
      <polygon points="-5.5,0 0,-9 5.5,0 0,9" fill="none" stroke="currentColor" stroke-width=".7"/>
      <polygon points="-2.4,0 0,-4 2.4,0 0,4" fill="none" stroke="currentColor" stroke-width=".35" opacity=".8"/>
    </g>
    <g id="shaft" fill="none">
      <line y1="-11.25" y2="-66" stroke="currentColor" stroke-width="1.2"/>
    </g>
    <g id="mid-arm" fill="none" stroke-linecap="round">
      <line y1="-11.25" y2="-110" stroke="currentColor" stroke-width="1.2"/>
      <g transform="translate(0 -44)"><use href="#s-plate"/></g>
      <g transform="translate(0 -66)"><use href="#s-plate"/></g>
      <g stroke="currentColor" stroke-width=".8">
        <g transform="translate(0 -44)"><line transform="rotate(-60)" y2="-24"/><line transform="rotate(60)" y2="-24"/></g>
        <g transform="translate(0 -66)"><line transform="rotate(-60)" y2="-30"/><line transform="rotate(60)" y2="-30"/></g>
      </g>
    </g>
    <g id="thick-arm" fill="none" stroke-linecap="round" stroke-linejoin="miter">
      <line y1="-11.25" y2="-176" stroke="currentColor" stroke-width="1.2"/>
      <g transform="translate(0 -44)"><use href="#s-plate"/></g>
      <g transform="translate(0 -66)"><use href="#s-plate"/></g>
      <g transform="translate(0 -88)"><use href="#s-plate"/></g>
      <g transform="translate(0 -110)"><use href="#s-plate"/></g>
      <g transform="translate(0 -132)"><use href="#s-plate"/></g>
      <g transform="translate(0 -154)"><use href="#s-plate" transform="scale(.78)"/></g>
      <g stroke="currentColor" stroke-width=".8">
        <g transform="translate(0 -44)"><line transform="rotate(-60)" y2="-24"/><line transform="rotate(60)" y2="-24"/></g>
        <g transform="translate(0 -66)"><line transform="rotate(-60)" y2="-30"/><line transform="rotate(60)" y2="-30"/></g>
        <g transform="translate(0 -88)"><line transform="rotate(-60)" y2="-28"/><line transform="rotate(60)" y2="-28"/></g>
        <g transform="translate(0 -110)"><line transform="rotate(-60)" y2="-22"/><line transform="rotate(60)" y2="-22"/></g>
        <g transform="translate(0 -132)"><line transform="rotate(-60)" y2="-16"/><line transform="rotate(60)" y2="-16"/></g>
        <g transform="translate(0 -154)"><line transform="rotate(-60)" y2="-10"/><line transform="rotate(60)" y2="-10"/></g>
      </g>
      <g transform="translate(0 -44) rotate(-60) translate(0 -14)"><use href="#s-plate" transform="scale(.55)"/></g>
      <g transform="translate(0 -44) rotate(60) translate(0 -14)"><use href="#s-plate" transform="scale(.55)"/></g>
      <g transform="translate(0 -66) rotate(-60) translate(0 -18)"><use href="#s-plate" transform="scale(.62)"/></g>
      <g transform="translate(0 -66) rotate(60) translate(0 -18)"><use href="#s-plate" transform="scale(.62)"/></g>
      <g transform="translate(0 -88) rotate(-60) translate(0 -16)"><use href="#s-plate" transform="scale(.55)"/></g>
      <g transform="translate(0 -88) rotate(60) translate(0 -16)"><use href="#s-plate" transform="scale(.55)"/></g>
      <g transform="translate(0 -110) rotate(-60) translate(0 -12)"><use href="#s-plate" transform="scale(.48)"/></g>
      <g transform="translate(0 -110) rotate(60) translate(0 -12)"><use href="#s-plate" transform="scale(.48)"/></g>
      <g transform="translate(0 -132) rotate(-60) translate(0 -9)"><use href="#s-plate" transform="scale(.4)"/></g>
      <g transform="translate(0 -132) rotate(60) translate(0 -9)"><use href="#s-plate" transform="scale(.4)"/></g>
    </g>
    <g id="nucleus">
      <polygon points="0,-32 27.71,-16 27.71,16 0,32 -27.71,16 -27.71,-16" fill="#182930" stroke="#86E0EC" stroke-width="1.4"/>
      <polygon points="0,-25 21.65,-12.5 21.65,12.5 0,25 -21.65,12.5 -21.65,-12.5" fill="#1E363E" stroke="#A38FDD" stroke-width=".45"/>
      <polygon points="0,-18 15.59,-9 15.59,9 0,18 -15.59,9 -15.59,-9" fill="#29474F" stroke="#86E0EC" stroke-width=".4"/>
      <polygon points="0,-11 9.53,-5.5 9.53,5.5 0,11 -9.53,5.5 -9.53,-5.5" fill="#396670" stroke="#F9FAFB" stroke-width=".5"/>
      <g fill="#1E363E" stroke="#86E0EC" stroke-width="1">
        <polygon points="0,-32 -2.6,-36.8 0,-41.5 2.6,-36.8"/>
        <g transform="rotate(60)"><polygon points="0,-32 -2.6,-36.8 0,-41.5 2.6,-36.8"/></g>
        <g transform="rotate(120)"><polygon points="0,-32 -2.6,-36.8 0,-41.5 2.6,-36.8"/></g>
        <g transform="rotate(180)"><polygon points="0,-32 -2.6,-36.8 0,-41.5 2.6,-36.8"/></g>
        <g transform="rotate(240)"><polygon points="0,-32 -2.6,-36.8 0,-41.5 2.6,-36.8"/></g>
        <g transform="rotate(300)"><polygon points="0,-32 -2.6,-36.8 0,-41.5 2.6,-36.8"/></g>
      </g>
      <circle r="4" fill="#86E0EC" opacity=".5"/>
      <circle r="2" fill="#F9FAFB"/>
      <circle r="0.55" fill="#070B14"/>
    </g>
  </defs>
  <g transform="translate(240 200) scale(0.52)">
    <g fill="none" filter="url(#s-glow)">
      <g color="#7EC8D4"><use href="#thick-arm"/></g>
      <g color="#9BB8C4"><g transform="rotate(60)"><use href="#thick-arm"/></g></g>
      <g color="#8AA3D0" opacity=".4" transform="rotate(120)"><use href="#shaft"/></g>
      <g color="#C4B4B0" opacity=".4" transform="rotate(180)"><use href="#shaft"/></g>
      <g color="#A38FDD" opacity=".45" transform="rotate(240)"><use href="#mid-arm"/></g>
      <g color="#7A9AA8" opacity=".4" transform="rotate(300)"><use href="#shaft"/></g>
    </g>
    <use href="#s-seat" fill="#070B14" stroke="#7EC8D4" stroke-width=".7" opacity=".7"/>
    <g transform="scale(0.45)" fill="none" stroke-linejoin="miter" filter="url(#n-glow)"><use href="#nucleus"/></g>
  </g>
  <g transform="translate(560 200) scale(0.52)">
    <g fill="none" filter="url(#s-glow)">
      <g color="#7EC8D4"><use href="#mid-arm"/></g>
      <g color="#9BB8C4" transform="rotate(60)"><use href="#mid-arm"/></g>
      <g color="#8AA3D0" transform="rotate(120)"><use href="#thick-arm"/></g>
      <g color="#C4B4B0" transform="rotate(180)"><use href="#mid-arm"/></g>
      <g color="#A38FDD" transform="rotate(240)"><use href="#thick-arm"/></g>
      <g color="#7A9AA8" opacity=".5" transform="rotate(300)"><use href="#shaft"/></g>
    </g>
    <use href="#s-seat" fill="#070B14" stroke="#7EC8D4" stroke-width=".7" opacity=".7"/>
    <g transform="scale(0.45)" fill="none" stroke-linejoin="miter" filter="url(#n-glow)"><use href="#nucleus"/></g>
  </g>
</svg>
