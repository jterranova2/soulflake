<section class="hero">
  <img class="hero-seed" src="assets/nucleus-beat-1.svg" alt="The center"/>
  <h1>My flake</h1>
  <p class="you" id="you"></p>
  <div class="file-row" id="file-row">
    <button type="button" class="ghost" id="export" disabled>Export</button>
    <button type="button" class="ghost" id="import" disabled>Import</button>
  </div>
  <div class="name-ask" id="ask">
    <p id="ask-q">What should we call you?</p>
    <p class="hint" id="ask-hint">Name the flake.</p>
    <div id="ask-fields"></div>
    <div class="row">
      <button type="button" class="ghost" id="ask-skip">Skip</button>
      <button type="button" class="btn" id="ask-ok">That’s me</button>
    </div>
  </div>
</section>
